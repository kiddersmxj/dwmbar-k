[sleep]
sleeptime = 100
bluetooth = 1000
network = 1000
media = 500
volume = 500
weather = 900000
battery = 600
signal = 500
cpu = 500
throttle = 2000
brightness = 500
winconnect = 2000
chronolog = 500
memory = 1000
storage = 300000
toggl = 1000
claude = 1000
archaudit = 1000
ccorral = 1000

[network]
# Ticks between public-IP lookups (external HTTPS request).
# 300 x sleep.network(1000ms) = 5 min. A route change refreshes immediately.
publicip-poll = 300

[chronolog]
cooldown = 500

[toggl]
# Ticks between Toggl fetches: 120 x sleep.toggl(1000ms) = 2 min.
poll = 120

[claude]
poll = 120
fivehour.yellow = 50
fivehour.red    = 75

[archaudit]
poll   = 1800
yellow = 1
red    = 5

[ccorral]
attention-poll = 3

[layout]
layout = [
    "network",
    "time",
    ";",
    "battery",
    "volume",
    "claude",
    "media",
    ";",
    "cpu",
    "toggl",
    "memory",
    "storage",
    "brightness",
    "winconnect",
    "archaudit",
    "ccorral",
    "signal",
    "bluetooth",
    "weather",
]
